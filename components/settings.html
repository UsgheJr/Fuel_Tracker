<section class="grid grid-cols-1 md:grid-cols-2 gap-6 no-print">
  <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
    <div class="flex items-center space-x-2">
      <i data-lucide="clock" class="w-5 h-5 text-indigo-600"></i>
      <h3 class="font-bold text-slate-800 text-sm">Promemoria Giornalieri Viaggi Abituali</h3>
    </div>
    <p class="text-xs text-slate-500">Configura un orario per ricevere un avviso per un viaggio ricorrente.</p>
    <div class="grid grid-cols-2 gap-2 pt-2">
      <input type="text" id="habitual-trip-name" placeholder="Es. Casa - Lavoro" class="text-xs rounded-lg border border-slate-300 p-2">
      <input type="time" id="habitual-trip-time" class="text-xs rounded-lg border border-slate-300 p-2">
    </div>
    <button id="btn-save-habitual" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-semibold py-2 rounded-lg transition">
      Salva Promemoria Abituale
    </button>
  </div>

  <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
    <div class="flex items-center space-x-2">
      <i data-lucide="database" class="w-5 h-5 text-emerald-600"></i>
      <h3 class="font-bold text-slate-800 text-sm">Sincronizzazione Supabase (Opzionale)</h3>
    </div>
    <p class="text-xs text-slate-500">Inserisci i parametri Supabase per sincronizzare i dati su cloud:</p>
    <div class="space-y-2">
      <input type="text" id="supabase-url" placeholder="https://xyz.supabase.co" class="w-full text-xs rounded border border-slate-300 p-2">
      <input type="password" id="supabase-key" placeholder="anon-public-key" class="w-full text-xs rounded border border-slate-300 p-2">
    </div>
    <button id="btn-save-supabase" class="w-full bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 text-xs font-semibold py-2 rounded-lg transition">
      Salva Credenziali Cloud
    </button>
  </div>
</section>
