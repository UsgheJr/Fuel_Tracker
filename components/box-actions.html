<section class="grid grid-cols-1 md:grid-cols-3 gap-6 no-print">
  <!-- GESTIONE BOX -->
  <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
    <div class="flex items-center justify-between border-b pb-3 border-slate-100">
      <div class="flex items-center space-x-2">
        <i data-lucide="gauge" class="w-5 h-5 text-indigo-600"></i>
        <h2 class="font-bold text-slate-800">Box Rifornimento</h2>
      </div>
      <span class="text-xs font-bold px-2 py-0.5 rounded bg-emerald-100 text-emerald-800">Box Attivo</span>
    </div>

    <div class="text-sm space-y-1">
      <p class="text-slate-500">Box Corrente: <strong id="lbl-box-title" class="text-slate-800">-</strong></p>
      <p class="text-slate-500">Prezzo Carburante: <strong id="lbl-box-price" class="text-indigo-600 font-bold">- €/l</strong></p>
    </div>

    <form id="form-new-box" class="space-y-3 pt-2 border-t border-slate-100">
      <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Nuovo Pieno / Rifornimento</h3>
      <div>
        <label class="block text-xs font-medium text-slate-600">Nome Box (es. Eni Fisciano)</label>
        <input type="text" required id="box-name-input" placeholder="Es. Pieno Ottobre" class="mt-1 w-full text-sm rounded-lg border-slate-300 border p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-medium text-slate-600">Prezzo (€/Litro)</label>
          <input type="number" step="0.001" min="0.1" required id="box-price-input" placeholder="1.789" class="mt-1 w-full text-sm rounded-lg border-slate-300 border p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600">Data Pieno</label>
          <input type="date" required id="box-date-input" class="mt-1 w-full text-sm rounded-lg border-slate-300 border p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
      </div>
      <button type="submit" class="w-full bg-indigo-50 text-indigo-700 hover:bg-indigo-100 border border-indigo-200 text-xs font-bold py-2 rounded-lg transition flex items-center justify-center gap-1">
        <i data-lucide="plus-circle" class="w-4 h-4"></i> Registra Nuovo Box
      </button>
    </form>
  </div>

  <!-- IMPORTAZIONE CSV / TESTO -->
  <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
    <div class="flex items-center space-x-2 border-b pb-3 border-slate-100">
      <i data-lucide="file-input" class="w-5 h-5 text-amber-500"></i>
      <h2 class="font-bold text-slate-800">Importa Viaggi (CSV)</h2>
    </div>
    <p class="text-xs text-slate-500 leading-relaxed">
      Carica il file CSV dei viaggi o incolla i dati grezzi:
    </p>
    <div>
      <label class="block text-xs font-medium text-slate-600 mb-1">Seleziona File CSV (.csv)</label>
      <input type="file" id="csv-file-input" accept=".csv" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-white hover:file:bg-slate-700 cursor-pointer">
    </div>
    <div class="pt-1">
      <textarea id="import-text" rows="2" placeholder="Oppure incolla qui i dati..." class="w-full text-xs font-mono rounded-lg border border-slate-300 p-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
      <button id="btn-import-text" class="mt-2 w-full bg-slate-800 text-white hover:bg-slate-700 text-xs font-bold py-2 rounded-lg transition flex items-center justify-center gap-1">
        <i data-lucide="upload" class="w-4 h-4"></i> Importa Testo nel Box Attivo
      </button>
    </div>
  </div>

  <!-- AGGIUNTA MANUALE -->
  <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
    <div class="flex items-center space-x-2 border-b pb-3 border-slate-100">
      <i data-lucide="pen-tool" class="w-5 h-5 text-emerald-600"></i>
      <h2 class="font-bold text-slate-800">Nuovo Viaggio Manuale</h2>
    </div>
    <form id="form-manual-trip" class="space-y-2">
      <div class="grid grid-cols-2 gap-2">
        <input type="text" id="m-start" placeholder="Partenza (es. Fisciano)" required class="text-xs rounded-lg border border-slate-300 p-2">
        <input type="text" id="m-dest" placeholder="Destinazione (es. Avellino)" required class="text-xs rounded-lg border border-slate-300 p-2">
      </div>
      <div class="grid grid-cols-2 gap-2">
        <input type="datetime-local" id="m-start-time" required class="text-xs rounded-lg border border-slate-300 p-2">
        <input type="datetime-local" id="m-dest-time" required class="text-xs rounded-lg border border-slate-300 p-2">
      </div>
      <div class="grid grid-cols-3 gap-2">
        <input type="number" step="0.1" id="m-km" placeholder="Km" required class="text-xs rounded-lg border border-slate-300 p-2">
        <input type="number" step="0.1" id="m-cons" placeholder="l/100km" required class="text-xs rounded-lg border border-slate-300 p-2">
        <input type="text" id="m-cat" placeholder="Categoria" required class="text-xs rounded-lg border border-slate-300 p-2">
      </div>
      <button type="submit" class="w-full bg-emerald-600 text-white hover:bg-emerald-500 text-xs font-bold py-2 rounded-lg transition flex items-center justify-center gap-1">
        <i data-lucide="plus" class="w-4 h-4"></i> Aggiungi Viaggio
      </button>
    </form>
  </div>
</section>
