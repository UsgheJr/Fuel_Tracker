<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FuelTracker - Gestione Viaggi & Spesa Benzina</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- html2pdf.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @media print {
      .no-print { display: none !important; }
      .print-only { display: block !important; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">

  <!-- TOP NAV -->
  <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-30 no-print">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i data-lucide="fuel" class="w-7 h-7 text-amber-300"></i>
        <span class="text-xl font-bold tracking-tight">FuelTracker</span>
      </div>
      <div class="flex items-center space-x-2">
        <button id="btn-request-notif" class="text-xs bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded-lg border border-indigo-400 flex items-center gap-1.5 transition">
          <i data-lucide="bell" class="w-4 h-4"></i> Attiva Notifiche
        </button>
        <button id="btn-export-pdf" class="text-xs bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg flex items-center gap-1.5 font-medium transition shadow-sm">
          <i data-lucide="file-down" class="w-4 h-4"></i> Esporta Report PDF
        </button>
      </div>
    </div>
  </header>

  <!-- BANNER PROMEMORIA -->
  <div id="reminder-banner" class="max-w-7xl mx-auto px-4 mt-4 hidden no-print">
    <div class="bg-amber-50 border-l-4 border-amber-500 p-3 rounded-r-lg shadow-sm flex items-start justify-between">
      <div class="flex items-center space-x-3">
        <i data-lucide="alert-circle" class="w-5 h-5 text-amber-600 flex-shrink-0"></i>
        <div class="text-sm text-amber-800" id="reminder-text"></div>
      </div>
      <button id="btn-dismiss-banner" class="text-amber-500 hover:text-amber-700">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
    <!-- Componente: KPI Cards -->
    <div id="component-kpi"></div>

    <!-- Componente: Box Rifornimento, Import CSV e Inserimento Manuale -->
    <div id="component-actions"></div>

    <!-- Componente: Report, Grafici e Tabelle Viaggi -->
    <div id="component-report"></div>

    <!-- Componente: Impostazioni & Supabase -->
    <div id="component-settings"></div>
  </main>

  <!-- Script di Modabiltà e Logica -->
  <script src="js/storage.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
